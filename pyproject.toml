[project]
name = "taxipred"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Omer Aytug", email = "aytugomer00@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.128.0",
    "folium>=0.15.0",
    "httpx>=0.28.1",
    "ipykernel>=7.1.0",
    "jupyter-contrib-nbextensions>=0.7.0",
    "matplotlib>=3.10.8",
    "pandas>=2.3.3",
    "pydantic>=2.12.5",
    "polyline>=2.0.0",
    "python-dotenv>=1.0.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.0",
    "seaborn>=0.13.2",
    "streamlit>=1.53.0",
    "streamlit-folium>=0.15.0",
    "uvicorn>=0.40.0",
    "xgboost>=3.1.3",
]

[project.scripts]
taxipred = "taxipred:main"

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"
